name: Report a crash
description: Sotid is crashing or freezing or hanging.
type: Crash
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Sotid install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Sotid
        2. Perform an action
        3. Sotid crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sotid version and system specs
      description: |
        Open the command palette in Sotid, then type “sotid: copy system specs into clipboard”.
      placeholder: |
        Sotid: v0.215.0 (Sotid bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
