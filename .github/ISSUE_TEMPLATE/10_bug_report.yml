name: Report a bug
description: Report a problem with Sotid.
type: Bug
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Is this bug already reported? Upvote to get it noticed faster. [Here’s the search](https://github.com/sotid/sotid/issues). Upvote means giving it a :+1: reaction.

        Feature request? Please open in [discussions](https://github.com/sotid/sotid/discussions/new/choose) instead.
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean Sotid install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Sotid
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sotid version and system specs
      description: |
        Open the command palette in Sotid, then type “sotid: copy system specs into clipboard”.
      placeholder: |
        Sotid: v0.215.0 (Sotid bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Sotid log file
      description: |
        Open the command palette in Sotid, then type `sotid: open log` to see the last 1000 lines. Or type `sotid: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Sotid.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Sotid settings
      description: |
        Open the command palette in Sotid, then type “sotid: open settings file” and copy/paste any relevant (e.g., LSP-specific) settings.

        ⚠️ **Please review your settings file for secrets (tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>settings.json</summary>

        <!-- Paste your settings inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Keymap
      description: |
        Open the command palette in Sotid, then type “sotid: open keymap file” and copy/paste the file’s contents.
      value: |
        <details><summary>keymap.json</summary>

        <!-- Paste your keymap file inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: dropdown
    attributes:
      label: If you are using WSL on Windows, what flavor of Linux are you using?
      multiple: false
      options:
        - Arch Linux
        - Ubuntu
        - Fedora
        - Mint
        - Pop!_OS
        - NixOS
        - Other
