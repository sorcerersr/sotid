name: Report a bug
description: Report a problem with Sotid.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Is this bug already reported? Upvote to get it noticed faster. [Here’s the search](https://github.com/sotid/sotid/issues). Upvote means giving it a :+1: reaction.

        Feature request? Please open a regular issue instead.
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean Sotid install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Sotid
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sotid version and system specs
      description: |
        Open the command palette in Sotid, then type “zed: copy system specs into clipboard”.
      placeholder: |
        Sotid: v0.215.0 (Sotid bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
