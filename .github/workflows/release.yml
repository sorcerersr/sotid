name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: ./script/bundle-linux
            artifact: 'target/release/sotid-linux-*.tar.gz'
          - os: macos-14
            bundle: ./script/bundle-mac
            artifact: 'target/*/release/Sotid-*.dmg'
          - os: windows-2022
            bundle: pwsh -File ./script/bundle-windows.ps1
            artifact: 'target/Sotid-*.exe'
    steps:
      - uses: actions/checkout@v4
      - name: Set up cargo config
        shell: bash
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: ./script/linux
      - name: Build bundle
        run: ${{ matrix.bundle }}
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: true
          generate_release_notes: false

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build flatpak bundle
        run: ./script/flatpak/bundle-flatpak
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: 'target/release/*.flatpak'
          draft: true
          generate_release_notes: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}
